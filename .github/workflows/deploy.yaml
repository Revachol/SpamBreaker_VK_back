name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      #      - name: Run linter
      #        run: |
      #          # Установка golangci-lint
      #          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2
      #          golangci-lint run ./...

#      - name: Run tests
#        run: go test

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare ssh
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_CONFIG: ${{ secrets.SSH_CONFIG }}
        run: |
          # Создаем приватный ключ для SSH
          mkdir -p ~/.ssh
          echo -n "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key $SERVER_CONFIG echo "SSH connection successful"

      - name: Prepare images
        env:
          BUILD_ENV: ${{ github.ref_name == 'refs/heads/main' && secrets.PROD_ENV || secrets.TEST_ENV }}
        run: |
          echo "$BUILD_ENV" > .env
          source .env
          docker compose build main_service bot_service ml_service
          docker save -o all_images.tar model-$MODE:$TAG bot-$MODE:$TAG main-$MODE:$TAG

      - name: Deploy
        env:
          SERVER_CONFIG: ${{ secrets.SSH_CONFIG }}
          APP_DIR: /home/ubuntu/spambreaker
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key all_images.tar .env docker-compose.yaml $SERVER_CONFIG:$APP_DIR
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key $SERVER_CONFIG "docker load -i $APP_DIR/all_images.tar"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key $SERVER_CONFIG "cd $APP_DIR && docker compose up -d"
