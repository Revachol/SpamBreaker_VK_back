# monitoring/prometheus.yaml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Node Exporter - системные метрики
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.*)'
        replacement: 'host-machine'

  # Ваши сервисы
  - job_name: 'core-service'
    static_configs:
      - targets: ['core_service:8080']
    scrape_interval: 15s
    metrics_path: /metrics

  - job_name: 'tg-service'
    static_configs:
      - targets: ['tg_service:8081']
    scrape_interval: 15s
    metrics_path: /metrics

  - job_name: 'vk-service'
    static_configs:
      - targets: ['vk_service:8081']
    scrape_interval: 15s
    metrics_path: /metrics

  - job_name: 'model-service'
    static_configs:
      - targets: ['model_service:8000']
    scrape_interval: 15s
    metrics_path: /metrics
