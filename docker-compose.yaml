services:
  core_service:
    build:
      context: .
      dockerfile: infra/dockerfiles/core.Dockerfile
    image: core-${MODE}:${TAG}
    container_name: core_${MODE}
    depends_on:
      ml_service:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "${CORE_PORT}:8080"
    environment:
      MODE: ${MODE}
      CONFIG_PATH: ./core_config.yaml
      PG_HOST: ${PG_HOST}
      PG_PORT: ${PG_PORT}
      PG_BASE: ${PG_BASE}
      PG_USER: ${PG_USER}
      PG_PSWD: ${PG_PSWD}
      ML_HOST: ${ML_HOST}
      ML_PORT: ${ML_PORT}
    networks:
      - service-net

  bot_service:
    build:
      context: .
      dockerfile: infra/dockerfiles/bot.Dockerfile
    image: bot-${MODE}:${TAG}
    container_name: bot_${MODE}
    depends_on:
      - core_service
    ports:
      - "${BOT_PORT}:8000"
    environment:
      MODE: ${MODE}
      CONFIG_PATH: ./bot_config.yaml
      CORE_HOST: ${CORE_HOST}
      CORE_PORT: ${CORE_PORT}
    networks:
      - service-net

  ml_service:
    build:
      context: ./ml
      dockerfile: configs/dockerfiles/ml.Dockerfile
    image: model-${MODE}:${TAG}
    container_name: model_${MODE}
    volumes:
      - ${MODEL_FILE}:/app/best_context_model.pt
    environment:
      MODE: ${MODE}
      MODEL_FILE: ${MODEL_FILE}
    networks:
      - service-net

  postgres:
    image: postgres:17
    container_name: postgres_sb_${MODE}
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PSWD}
      POSTGRES_DB: ${PG_BASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - service-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_BASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: adminer_sb_${MODE}
    restart: always
    depends_on:
      - postgres
    ports:
      - "${AD_PORT}:8080"
    networks:
      - service-net

volumes:
  postgres_data:
    name: postgres_${MODE}_data

networks:
  service-net:
    name: net-${MODE}
    driver: bridge
