services:
  main_service:
    build:
      context: .
      dockerfile: infra/dockerfiles/service.Dockerfile
    image: main-${MODE}:${TAG}
    container_name: main_${MODE}
    depends_on:
      ml_service:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "${MAIN_PORT}:8080"
    env_file:
      - ${MODE}.env
    networks:
      - service-net

  bot_service:
    build:
      context: .
      dockerfile: infra/dockerfiles/bot.Dockerfile
    image: bot-${MODE}:${TAG}
    container_name: bot_${MODE}
    depends_on:
      - main_service
    ports:
      - "${BOT_PORT}:8000"
    env_file:
      - ${MODE}.env
    networks:
      - service-net

  ml_service:
    build:
      context: ./ml
      dockerfile: configs/dockerfiles/ml.Dockerfile
    image: model-${MODE}:${TAG}
    container_name: model_${MODE}
    volumes:
      - ${MODEL_FILE}:/app/best_context_model.pt
    env_file:
      - ${MODE}.env
    networks:
      - service-net

  postgres:
    image: postgres:17
    container_name: postgres_sb_${MODE}
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PSWD}
      POSTGRES_DB: ${PG_BASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - service-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_BASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: adminer_sb_${MODE}
    restart: always
    depends_on:
      - postgres
    ports:
      - "${AD_PORT}:8080"
    networks:
      - service-net

volumes:
  postgres_data:
    name: postgres_${MODE}_data

networks:
  service-net:
    name: net-${MODE}
    driver: bridge
