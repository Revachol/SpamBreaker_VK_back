app:
  name: CORE
  host: 0.0.0.0
  port: 8080
  prefix: /api/v1
  swagger_path: ./data/docs/server.json

  cors:
    allowed_origins:
      - http://127.0.0.1:3000
      - http://localhost:3000
      - http://87.239.104.16:3000
      - http://127.0.0.1:3010
      - http://localhost:3010
      - http://87.239.104.16:3010

  logger:
    level: TRACE

  postgres:
    host: PG_HOST
    port: PG_PORT
    base: PG_BASE
    user: PG_USER
    password: PG_PSWD
    migrated: true
    migrations: ./migrations

  ml_service:
    host: ML_HOST
    port: ML_PORT

  jwt:
    # Значение берётся из переменной окружения JWT_SECRET.
    # Здесь указываем имя переменной — config.loadEnv подставит реальное значение.
    secret: JWT_SECRET
    ttl: 24h

  telegram:
    token: TELEGRAM_TOKEN

  vk:
    token: VK_TOKEN
